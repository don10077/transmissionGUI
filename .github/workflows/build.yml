name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both Windows jobs remain separate runners inside this reusable workflow.
  windows:
    name: Windows (installer + portable)
    uses: ./.github/workflows/windows.yml

  linux:
    name: Linux (DEB)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-l10n-tools libgtest-dev zlib1g-dev libarchive-dev libxkbcommon-dev dpkg-dev file xvfb xauth desktop-file-utils
      - name: Build and run tests (warnings as errors)
        run: |
          cmake --preset ci
          cmake --build --preset ci --parallel
          ctest --preset ci
      - name: Package and smoke-test DEB
        run: |
          cpack --config build/ci/CPackConfig.cmake -B build/packages
          dpkg-deb -x build/packages/*.deb build/portable
          desktop-file-validate build/portable/usr/share/applications/transmissiongui.desktop
          test -f build/portable/usr/share/icons/hicolor/192x192/apps/transmissiongui.png
          xvfb-run -a build/portable/usr/bin/transmissiongui --smoke-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transmissiongui-linux
          path: build/packages/*.deb
          if-no-files-found: error

  asan:
    name: Tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-l10n-tools libgtest-dev zlib1g-dev libarchive-dev libxkbcommon-dev
      - name: Build and run tests under ASan/UBSan
        run: |
          cmake --preset asan
          cmake --build --preset asan --parallel
          ctest --preset asan

  macos:
    name: macOS (DMG)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: brew install qt ninja googletest libarchive
      - name: Build and run tests
        run: |
          cmake --preset release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DLibArchive_ROOT="$(brew --prefix libarchive)"
          cmake --build --preset release --parallel
          ctest --preset release
      - name: Package and smoke-test DMG
        run: |
          cpack --config build/release/CPackConfig.cmake -B build/packages
          mkdir -p build/portable
          hdiutil attach build/packages/*.dmg -readonly -nobrowse -mountpoint "$PWD/build/portable"
          trap 'hdiutil detach "$PWD/build/portable"' EXIT
          QT_QPA_PLATFORM=cocoa build/portable/transmissiongui.app/Contents/MacOS/transmissiongui --smoke-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transmissiongui-macos
          path: build/packages/*.dmg
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, asan, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        shell: bash
        run: |
          version="$(sed -n 's/^[[:space:]]*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match project version v$version"
            exit 1
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: transmissiongui-*
          path: packages
          merge-multiple: true
      - name: Package checksums
        working-directory: packages
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: packages/*
          fail_on_unmatched_files: true
          generate_release_notes: true
